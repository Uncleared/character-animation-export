name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q tools tests 'src/AnimationExport/Blender~'
      - name: Test packaging and package guards
        run: python -m unittest discover -s tests -v
      - name: Build release downloads
        run: python tools/build_release.py
